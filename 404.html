<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Marina Tkachenko — Senior Product Designer</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://marinatkachenko.com/404.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://marinatkachenko.com/404.html" />
  <meta property="og:title" content="Marina Tkachenko — Senior Product Designer" />
  <meta property="og:description" content="Senior Product Designer · Fintech, Edtech, Software Development." />
  <meta property="og:image" content="https://marinatkachenko.com/images/og/cover-home.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Marina Tkachenko, Senior Product Designer: portfolio" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://marinatkachenko.com/images/og/cover-home.jpg" />
  <script>
    /* Fallback: …/en and …/ru normally open en/index.html and ru/index.html.
       Send it to the site root with ?lang=…; js/i18n.js restores the
       pretty …/en or …/ru address. */
    (function () {
      var m = location.pathname.match(/^(.*\/)(en|ru)\/?$/);
      if (m) location.replace(m[1] + '?lang=' + m[2] + location.hash);
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <!-- Language and theme before first paint: the address, then the saved choice, then English and dark (same order as js/i18n.js) -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#150E14" />
  <script>
    (function () {
      var root = document.documentElement, lang = null, theme = null;
      var query = new URLSearchParams(location.search).get('lang');
      var path = (location.pathname.match(/\/(en|ru)\/?$/) || [])[1];
      try { lang = localStorage.getItem('site-lang'); theme = localStorage.getItem('site-theme'); } catch (e) {}
      if (query === 'en' || query === 'ru') lang = query;
      if (path) lang = path;
      root.lang = lang === 'ru' ? 'ru' : 'en';
      if (theme !== 'light') return;
      root.dataset.theme = 'light';
      document.querySelector('meta[name="color-scheme"]').content = 'light';
      document.querySelector('meta[name="theme-color"]').content = '#F8F3F5';
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; box-sizing: border-box; padding: var(--space-4);
           display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; align-content: center; gap: var(--space-6);
           font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
    img { display: block; width: min(640px, 100%); height: auto; aspect-ratio: 1734 / 907; object-fit: contain; border-radius: var(--radius-sm); }
    .art-dark, [data-theme="dark"] .art-light { display: none; }
    [data-theme="dark"] .art-dark { display: block; }
    p { margin: 0; text-align: center; }
    a { color: var(--color-accent); }
  </style>
</head>
<body>
  <img class="art-light" src="/images/404-light.webp" alt="" width="1734" height="907" loading="lazy" />
  <img class="art-dark" src="/images/404.webp" alt="" width="1735" height="906" loading="lazy" />
  <script>
    /* Both pictures are lazy, so the one hidden by CSS is never requested;
       the one for the current theme loads right away. */
    document.querySelector(document.documentElement.dataset.theme === 'dark' ? '.art-dark' : '.art-light').loading = 'eager';
  </script>
  <p><span id="not-found">Page not found.</span> <a id="not-found-home" href="/">Go to the home page</a></p>
  <script>
    /* The language is set in <head>; js/i18n.js isn't loaded here because
       it also rewrites the address. */
    (function () {
      if (document.documentElement.lang !== 'ru') return;
      document.getElementById('not-found').textContent = 'Страница не найдена.';
      document.getElementById('not-found-home').textContent = 'На главную';
    })();
  </script>
</body>
</html>
