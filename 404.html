<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marina Tkachenko — Product Designer</title>
  <script>
    /* GitHub Pages has no routing: a direct visit to …/en or …/ru lands here.
       Send it to the site root with ?lang=…; js/i18n.js restores the
       pretty …/en or …/ru address. */
    (function () {
      var m = location.pathname.match(/^(.*\/)(en|ru)\/?$/);
      if (m) location.replace(m[1] + '?lang=' + m[2] + location.hash);
    })();
  </script>
  <link rel="stylesheet" href="/portfolio/css/tokens.css" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('site-theme'); } catch (e) {}
      document.documentElement.dataset.theme =
        t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
    a { color: var(--color-accent); }
  </style>
</head>
<body>
  <p>Page not found. <a href="/portfolio/">Go to the home page</a></p>
</body>
</html>
